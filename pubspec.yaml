name: cal_caliente
description: "Cal Caliente — Salsa & Bachata Japan event calendar (Flutter + Firebase sister of cal-caliente)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase (emulator-first; same majors as Seed)
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  cloud_functions: ^6.3.2
  # State & navigation (Seed conventions)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.2
  go_router: ^17.0.1
  # UI / misc
  intl: ^0.20.2
  url_launcher: ^6.3.0
  table_calendar: ^3.1.2
  # ponytail: flutter_map (OSM tiles, same as the old app's Leaflet map) instead of
  # google_maps_flutter — no API key, no billing surface, works on emulators today.
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  firebase_app_check: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.3
  fake_cloud_firestore: ^4.0.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
