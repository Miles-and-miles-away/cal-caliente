name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Node 23 ships a corepack signature-verification bug that breaks
          # `pnpm install` on a fresh machine. Pin to 22 LTS until that's fixed.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

  audit:
    # Surfaces high-severity advisories without blocking the build. Once we've
    # upgraded drizzle-orm and @trpc/server, change `|| true` to a hard fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: npm audit (high)
        run: pnpm audit --audit-level=high --prod || true
